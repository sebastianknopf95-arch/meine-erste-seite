<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Danke für deine Anfrage – Knopf Digital</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0A0A0D;color:#ECECF1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;text-align:center;padding:24px;}
  .box{max-width:480px;}
  .check{width:72px;height:72px;border-radius:50%;margin:0 auto 28px;display:flex;align-items:center;justify-content:center;
    background:rgba(110,139,255,.14);color:#6E8BFF;}
  h1{font-size:32px;letter-spacing:-.02em;margin:0 0 14px;}
  p{color:#9595A0;font-size:17px;line-height:1.6;margin:0 0 32px;}
  a{display:inline-block;background:#6E8BFF;color:#0A0A0D;font-weight:600;text-decoration:none;
    padding:14px 28px;border-radius:999px;transition:transform .15s;}
  a:hover{transform:translateY(-2px);}
</style>
</head>
<body>
  <div class="box">
    <div class="check">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m5 12 5 5L20 7"/></svg>
    </div>
    <h1>Danke – deine Anfrage ist da!</h1>
    <p>Ich habe deine Nachricht erhalten und melde mich innerhalb von 24 Stunden bei dir. Schau auch kurz in deinen Spam-Ordner, falls meine Antwort nicht ankommt.</p>
    <a href="/">Zurück zur Startseite</a>
  </div>
</body>
</html>
