<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meine erste automatische Webseite</title>
  <style>
    body { margin:0; font-family: system-ui, sans-serif; background:#0f172a;
      color:#e2e8f0; display:flex; min-height:100vh; align-items:center;
      justify-content:center; text-align:center; }
    h1 { font-size:2rem; margin-bottom:.5rem; }
    p { color:#94a3b8; }
    .badge { display:inline-block; margin-top:1.5rem; padding:.5rem 1rem;
      background:#1e293b; border-radius:999px; font-size:.9rem; }
  </style>
</head>
<body>
  <div>
    <h1>🚀 Es läuft!</h1>
    <p>Diese Seite hat sich selbst veröffentlicht.</p>
    <div class="badge">Version 2 – automatisch!!! 🚀</div>
  </div>
</body>
</html>
